version: '3.8'

services:
  api:
    build:
      context: ./backend/v2
    ports:
      - "5001:5000"
    environment:
      - DATABASE=mysql
      - GREENHOUSE_MYSQL_USER=root
      - GREENHOUSE_MYSQL_PWD=example
      - GREENHOUSE_MYSQL_HOST=db
      - GREENHOUSE_MYSQL_DB=greenhouse
      - GREENHOUSE_MYSQL_PORT=3306
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: greenhouse
    ports:
      - "3306:3306"

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
